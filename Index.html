<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Telegram Shop Mini App</title>
    <!-- Подключаем официальный скрипт Telegram WebApp API -->
    <script src="https://telegram.org"></script>
    <style>
        /* Использование системных переменных Telegram для авто-поддержки темной/светлой темы */
        :root {
            --bg-color: var(--tg-theme-bg-color, #ffffff);
            --text-color: var(--tg-theme-text-color, #000000);
            --hint-color: var(--tg-theme-hint-color, #999999);
            --link-color: var(--tg-theme-link-color, #2481cc);
            --button-color: var(--tg-theme-button-color, #2481cc);
            --button-text-color: var(--tg-theme-button-text-color, #ffffff);
            --secondary-bg-color: var(--tg-theme-secondary-bg-color, #f4f4f5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 80px; /* Отступ под нижнюю кнопку */
            overflow-x: hidden;
        }

        /* Категории (Фильтры) */
        .categories-container {
            position: sticky;
            top: 0;
            background-color: var(--bg-color);
            z-index: 10;
            padding: 12px;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            white-space: nowrap;
            border-bottom: 1px solid var(--secondary-bg-color);
        }

        .categories-container::-webkit-scrollbar {
            display: none;
        }

        .category-chip {
            background-color: var(--secondary-bg-color);
            color: var(--text-color);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .category-chip.active {
            background-color: var(--button-color);
            color: var(--button-text-color);
        }

        /* Сетка товаров */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            padding: 12px;
        }

        .product-card {
            background-color: var(--secondary-bg-color);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            position: relative;
        }

        .product-img {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            background-color: #ddd;
        }

        .product-info {
            padding: 10px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }

        .product-title {
            font-size: 14px;
            font-weight: 600;
            line-height: 1.3;
            margin-bottom: 6px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .product-price {
            font-size: 16px;
            font-weight: 700;
            color: var(--link-color);
            margin-bottom: 8px;
        }

        .add-btn {
            width: 100%;
            background-color: var(--button-color);
            color: var(--button-text-color);
            border: none;
            padding: 8px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
        }

        .add-btn.in-cart {
            background-color: #e5e5ea;
            color: #000000;
        }

        /* Модальное окно */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: flex-end;
            z-index: 100;
        }

        .modal-content {
            background-color: var(--bg-color);
            width: 100%;
            max-height: 85vh;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            padding: 20px;
            overflow-y: auto;
            position: relative;
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .close-modal {
            position: absolute;
            top: 15px;
            right: 15px;
            background: var(--secondary-bg-color);
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            font-weight: bold;
            color: var(--text-color);
            cursor: pointer;
        }

        .modal-img {
            width: 100%;
            max-height: 250px;
            object-fit: contain;
            border-radius: 12px;
            margin-bottom: 15px;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .modal-desc {
            font-size: 14px;
            color: var(--hint-color);
            line-height: 1.4;
            margin-bottom: 15px;
        }

        .modal-price {
            font-size: 22px;
            font-weight: 700;
            color: var(--link-color);
            margin-bottom: 20px;
        }

        /* Плашка корзины внизу экрана */
        .cart-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: var(--bg-color);
            border-top: 1px solid var(--secondary-bg-color);
            padding: 12px 16px;
            display: none;
            justify-content: space-between;
            align-items: center;
            z-index: 90;
        }

        .cart-info {
            display: flex;
            flex-direction: column;
        }

        .cart-count {
            font-size: 12px;
            color: var(--hint-color);
        }

        .cart-total {
            font-size: 18px;
            font-weight: 700;
        }

        .checkout-btn {
            background-color: var(--button-color);
            color: var(--button-text-color);
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Навигация по категориям -->
    <div class="categories-container" id="categories">
        <button class="category-chip active" onclick="filterCategory('all')">Все</button>
        <button class="category-chip" onclick="filterCategory('phones')">Смартфоны</button>
        <button class="category-chip" onclick="filterCategory('audio')">Аудио</button>
        <button class="category-chip" onclick="filterCategory('accessories')">Аксессуары</button>
    </div>

    <!-- Контейнер с товарами -->
    <div class="products-grid" id="products"></div>

    <!-- Модальное окно просмотра товара -->
    <div class="modal-overlay" id="modal" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <button class="close-modal" onclick="toggleModal(false)">×</button>
            <img class="modal-img" id="modal-img" src="" alt="">
            <div class="modal-title" id="modal-title"></div>
            <div class="modal-desc" id="modal-desc"></div>
            <div class="modal-price" id="modal-price"></div>
            <button class="add-btn" id="modal-action-btn" style="padding: 14px; font-size: 16px;"></button>
        </div>
    </div>

    <!-- Нижняя панель заказа -->
    <div class="cart-bar" id="cart-bar">
        <div class="cart-info">
            <span class="cart-count" id="cart-count">Товаров: 0</span>
            <span class="cart-total" id="cart-total">0 ₽</span>
        </div>
        <button class="checkout-btn" onclick="sendOrder()">Заказать</button>
    </div>

    <script>
        // Инициализация Telegram WebApp API
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand(); // Расширяем приложение на весь экран

            { id: 2, category: 'phones', title: 'Смартфон Cyber Note 12', price: 24990, desc: 'Отличный бюджетный выбор с мощной батареей на 6000 мАч.', img: 'https://picsum.photos' },
            { id: 3, category: 'audio', title: 'Наушники TG Buds Pro', price: 11990, desc: 'Беспроводные наушники с активным шумоподавлением и глубокими басами.', img: 'https://picsum.photos' },
            { id: 4, category: 'audio', title: 'Портативная Колонка SoundBox', price: 7490, desc: 'Влагозащищенная колонка мощностью 20 Вт для лучших вечеринок.', img: 'https://picsum.photos' },
            { id: 5, category: 'accessories', title: 'Повербанк Energy 20k', price: 3490, desc: 'Внешний аккумулятор емкостью 20 000 мАч с поддержкой быстрой зарядки.', img: 'https://picsum.photos' },
