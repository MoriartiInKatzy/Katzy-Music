<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Katzy Music</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #0a0a0c);
            --text-color: var(--tg-theme-text-color, #ffffff);
            --hint-color: var(--tg-theme-hint-color, #8e8e93);
            --link-color: var(--tg-theme-link-color, #0a84ff);
            --button-color: var(--tg-theme-button-color, #ffffff);
            --button-text-color: var(--tg-theme-button-text-color, #000000);
            --secondary-bg-color: rgba(255, 255, 255, 0.06);
            --glass-border: rgba(255, 255, 255, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 100px;
            overflow-x: hidden;
        }

        /* iOS Стеклянная шапка */
        .app-header {
            position: sticky;
            top: 0;
            background-color: rgba(10, 10, 12, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 20;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--glass-border);
        }

        .app-logo {
            height: 32px;
            object-fit: contain;
        }

        /* Категории (фильтры) */
        .categories-container {
            position: sticky;
            top: 61px;
            background-color: rgba(10, 10, 12, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 15;
            padding: 12px 16px;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            white-space: nowrap;
            border-bottom: 1px solid var(--glass-border);
        }

        .categories-container::-webkit-scrollbar {
            display: none;
        }

        .category-chip {
            background-color: var(--secondary-bg-color);
            color: var(--text-color);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            border: 1px solid var(--glass-border);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            backdrop-filter: blur(10px);
        }

        .category-chip:active {
            transform: scale(0.95);
        }

        .category-chip.active {
            background-color: #ffffff;
            color: #000000;
            border-color: #ffffff;
        }

        /* Сетка товаров */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            padding: 14px 16px;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Стеклянные карточки товаров */
        .product-card {
            background: var(--secondary-bg-color);
            border: 1px solid var(--glass-border);
            border-radius: 18px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            position: relative;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: transform 0.25s ease, background-color 0.25s ease;
        }

        .product-card:active {
            transform: scale(0.96);
            background: rgba(255, 255, 255, 0.09);
        }

        .product-img-wrapper {
            width: 100%;
            aspect-ratio: 1;
            overflow: hidden;
            background-color: #1c1c1e;
        }

        .product-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .product-card:hover .product-img {
            transform: scale(1.04);
        }

        .product-info {
            padding: 12px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }

        .product-title {
            font-size: 13px;
            font-weight: 600;
            line-height: 1.3;
            margin-bottom: 6px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .product-price {
            font-size: 15px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 10px;
        }

        /* Тактильная стеклянная кнопка */
        .add-btn {
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 9px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .add-btn:active {
            transform: scale(0.94);
            background: rgba(255, 255, 255, 0.25);
        }

        .add-btn.in-cart {
            background: #ffffff;
            color: #000000;
            border-color: #ffffff;
        }

        /* Модальное окно */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: none;
            justify-content: center;
            align-items: flex-end;
            z-index: 100;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.open {
            display: flex;
            opacity: 1;
        }

        .modal-content {
            background-color: #161618;
            border: 1px solid var(--glass-border);
            width: 100%;
            max-height: 85vh;
            border-top-left-radius: 28px;
            border-top-right-radius: 28px;
            padding: 24px 20px 34px 20px;
            overflow-y: auto;
            position: relative;
            transform: translateY(100%);
            transition: transform 0.35s cubic-bezier(0.1, 1, 0.1, 1);
        }

        .modal-overlay.open .modal-content {
            transform: translateY(0);
        }

        .close-modal {
            position: absolute;
            top: 16px;
            right: 16px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--glass-border);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-weight: bold;
            font-size: 16px;
            color: #ffffff;
            cursor: pointer;
        }

        .modal-img {
            width: 100%;
            max-height: 280px;
            object-fit: cover;
            border-radius: 16px;
            margin-bottom: 16px;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .modal-desc {
            font-size: 14px;
            color: var(--hint-color);
            line-height: 1.5;
            margin-bottom: 16px;
        }

        .modal-price {
            font-size: 22px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 20px;
        }

        /* Нижняя панель корзины (iOS style) */
        .cart-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: rgba(22, 22, 24, 0.85);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-top: 1px solid var(--glass-border);
            padding: 14px 20px;
            display: none;
            justify-content: space-between;
            align-items: center;
            z-index: 90;
            animation: slideUpBar 0.3s cubic-bezier(0.1, 1, 0.1, 1);
        }

        @keyframes slideUpBar {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .cart-info {
            display: flex;
            flex-direction: column;
        }

        .cart-count {
            font-size: 12px;
            color: var(--hint-color);
        }

        .cart-total {
            font-size: 18px;
            font-weight: 700;
        }

        .checkout-btn {
            background: #ffffff;
            color: #000000;
            border: none;
            padding: 12px 24px;
            border-radius: 14px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .checkout-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <!-- Стеклянная шапка с логотипом -->
    <header class="app-header">
        <img class="app-logo" src="https://raw.githubusercontent.com/MoriartiInKatzy/Katzy-Music/main/logo.png" alt="KATZY MUSIC" onerror="this.src='https://picsum.photos/120/35?random=logo'">
    </header>

    <!-- Фильтры категорий -->
    <div class="categories-container" id="categories">
        <button class="category-chip active" onclick="filterCategory('all', this)">Все</button>
        <button class="category-chip" onclick="filterCategory('management', this)">Управление</button>
        <button class="category-chip" onclick="filterCategory('design', this)">Дизайн</button>
        <button class="category-chip" onclick="filterCategory('promotion', this)">Продвижение</button>
    </div>

    <!-- Сетка товаров -->
    <div class="products-grid" id="products"></div>

    <!-- Модальное окно -->
    <div class="modal-overlay" id="modal" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <button class="close-modal" onclick="toggleModal(false)">×</button>
            <img class="modal-img" id="modal-img" src="" alt="">
            <div class="modal-title" id="modal-title"></div>
            <div class="modal-desc" id="modal-desc"></div>
            <div class="modal-price" id="modal-price"></div>
            <button class="add-btn" id="modal-action-btn" style="padding: 14px; font-size: 15px;"></button>
        </div>
    </div>

    <!-- Панель корзины -->
    <div class="cart-bar" id="cart-bar">
        <div class="cart-info">
            <span class="cart-count" id="cart-count">Товаров: 0</span>
            <span class="cart-total" id="cart-total">0 ₽</span>
        </div>
        <button class="checkout-btn" onclick="sendOrder()">Заказать</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        /* База данных с вашими 5 товарами и точными ценами */
        const productsData = [
            { 
                id: 1, 
                category: 'management', 
                title: 'Manager Artist', 
                price: 5200, 
                priceText: '5 200 ₽ / Месяц', 
                desc: 'Профессиональный менеджмент артиста, координация релизов, выстраивание стратегии развития и полное сопровождение.', 
                img: 'https://raw.githubusercontent.com/MoriartiInKatzy/Katzy-Music/main/1.jpg' 
            },
            { 
                id: 2, 
                category: 'design', 
                title: 'Обложка | Дизайн для релиза', 
                price: 1400, 
                priceText: '1 400 ₽', 
                desc: 'Уникальная стильная обложка для вашего трека или альбома под ключ в эстетике бренда.', 
                img: 'https://raw.githubusercontent.com/MoriartiInKatzy/Katzy-Music/main/2.jpg' 
            },
            { 
                id: 3, 
                category: 'promotion', 
                title: 'Target', 
                price: 6500, 
                priceText: '6 500 ₽', 
                desc: 'Настройка эффективной таргетированной рекламы для привлечения новой аудитории и роста прослушиваний.', 
                img: 'https://raw.githubusercontent.com/MoriartiInKatzy/Katzy-Music/main/3.jpg' 
            },
            { 
                id: 4, 
                category: 'management', 
                title: 'PREMIER SERVICE | Подписка', 
                price: 11000, 
                priceText: '11 000 ₽ / Месяц', 
                desc: 'Премиальный пакет услуг полного цикла для артистов высшего уровня с приоритетной поддержкой.', 
                img: 'https://raw.githubusercontent.com/MoriartiInKatzy/Katzy-Music/main/4.jpg' 
            },
            { 
                id: 5, 
                category: 'promotion', 
                title: 'Marketing | SMM', 
                price: 8490, 
                priceText: '8 490 ₽', 
                desc: 'Комплексный маркетинг и ведение социальных сетей, продвижение в TikTok, YouTube и других площадках.', 
                img: 'https://raw.githubusercontent.com/MoriartiInKatzy/Katzy-Music/main/5.jpg' 
            }
        ];

        let cart = {};
        let currentCategory = 'all';
        let currentModalProduct = null;

        function renderProducts() {
            const grid = document.getElementById('products');
            grid.innerHTML = '';
            
            const filtered = currentCategory === 'all' 
                ? productsData 
                : productsData.filter(p => p.category === currentCategory);

            filtered.forEach(product => {
                const inCartCount = cart[product.id] ? cart[product.id].quantity : 0;
                
                const card = document.createElement('div');
                card.className = 'product-card';
                card.onclick = () => openModal(product.id);
                
                card.innerHTML = `
                    <div class="product-img-wrapper">
                        <img class="product-img" src="${product.img}" alt="${product.title}" onerror="this.src='https://picsum.photos/400?random=${product.id}'">
                    </div>
                    <div class="product-info">
                        <div>
                            <div class="product-title">${product.title}</div>
                            <div class="product-price">${product.priceText || product.price + ' ₽'}</div>
                        </div>
                        <button class="add-btn ${inCartCount > 0 ? 'in-cart' : ''}" onclick="event.stopPropagation(); toggleCartItem(${product.id})">
                            ${inCartCount > 0 ? `В корзине (${inCartCount})` : 'В корзину'}
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterCategory(category, element) {
            currentCategory = category;
            document.querySelectorAll('.category-chip').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
            renderProducts();
        }

        function openModal(id) {
            currentModalProduct = productsData.find(p => p.id === id);
            if (!currentModalProduct) return;

            document.getElementById('modal-img').src = currentModalProduct.img;
            document.getElementById('modal-title').innerText = currentModalProduct.title;
            document.getElementById('modal-desc').innerText = currentModalProduct.desc;
            document.getElementById('modal-price').innerText = currentModalProduct.priceText || currentModalProduct.price + ' ₽';
            
            updateModalButton();
            document.getElementById('modal').classList.add('open');
        }

        function toggleModal(show) {
            const modal = document.getElementById('modal');
            if (show) {
                modal.classList.add('open');
            } else {
                modal.classList.remove('open');
            }
        }

        function closeModal(e) {
            if (e.target.id === 'modal') {
                toggleModal(false);
            }
        }

        function toggleCartItem(id) {
            if (!cart[id]) {
                const product = productsData.find(p => p.id === id);
                cart[id] = { ...product, quantity: 1 };
            } else {
                cart[id].quantity += 1;
            }
            updateCartUI();
            renderProducts();
            if (currentModalProduct && currentModalProduct.id === id) {
                updateModalButton();
            }
        }

        function updateModalButton() {
            const btn = document.getElementById('modal-action-btn');
            const inCart = cart[currentModalProduct.id];
            if (inCart) {
                btn.innerText = `Добавить еще (${inCart.quantity} в корзине)`;
                btn.className = 'add-btn in-cart';
            } else {
                btn.innerText = 'В корзину';
                btn.className = 'add-btn';
            }
            btn.onclick = () => toggleCartItem(currentModalProduct.id);
        }

        function updateCartUI() {
            let totalCount = 0;
            let totalPrice = 0;

            for (let id in cart) {
                totalCount += cart[id].quantity;
                totalPrice += cart[id].price * cart[id].quantity;
            }

            const cartBar = document.getElementById('cart-bar');
            if (totalCount > 0) {
                cartBar.style.display = 'flex';
                document.getElementById('cart-count').innerText = `Товаров: ${totalCount}`;
                document.getElementById('cart-total').innerText = `${totalPrice.toLocaleString()} ₽`;
            } else {
                cartBar.style.display = 'none';
            }
        }

        function sendOrder() {
            let orderText = 'Заказ из KATZY MUSIC:\n';
            for (let id in cart) {
                orderText += `- ${cart[id].title} x${cart[id].quantity} (${cart[id].price * cart[id].quantity} ₽)\n`;
            }
            
            tg.sendData(JSON.stringify(cart));
            tg.close();
        }

        renderProducts();
    </script>
</body>
</html>
